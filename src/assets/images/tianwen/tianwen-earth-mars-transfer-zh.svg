<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">天问一号地火转移中文示意图</title><desc id="desc">展示从地球出发、中途修正到火星捕获的中文任务示意图。</desc>
  <defs><radialGradient id="bg"><stop stop-color="#1a355c"/><stop offset="1" stop-color="#071325"/></radialGradient><radialGradient id="earth"><stop stop-color="#8dd7ff"/><stop offset=".58" stop-color="#1c76be"/><stop offset="1" stop-color="#103c73"/></radialGradient><radialGradient id="mars"><stop stop-color="#e69266"/><stop offset="1" stop-color="#87372c"/></radialGradient></defs><rect width="1200" height="760" fill="url(#bg)"/>
  <text x="70" y="92" fill="#f2d2c2" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">天问一号地火转移</text><text x="70" y="130" fill="#a9bdd6" font-family="Microsoft YaHei, sans-serif" font-size="20">中文重绘示意 · 日心轨道非比例图</text>
  <circle cx="600" cy="405" r="54" fill="#ffd86d"/><circle cx="255" cy="485" r="72" fill="url(#earth)"/><circle cx="945" cy="275" r="58" fill="url(#mars)"/><path d="M255 485C405 143 760 135 945 275" fill="none" stroke="#83e4d3" stroke-width="6" stroke-dasharray="14 13"/><path d="M290 456L332 428m-15 29l17 18" stroke="#f4ffff" stroke-width="7"/><circle cx="593" cy="204" r="11" fill="#79e6d1"/>
  <g fill="none" stroke="#8debd8" stroke-width="3"><path d="M95 510H166L213 490"/><path d="M1000 190H958L945 225"/><path d="M570 180V193"/><path d="M846 576H740L648 430"/></g><g fill="#8debd8"><circle cx="213" cy="490" r="6"/><circle cx="945" cy="225" r="6"/><circle cx="593" cy="204" r="6"/><circle cx="648" cy="430" r="6"/></g>
  <g font-family="Microsoft YaHei, sans-serif"><text x="95" y="540" fill="#eaf7ff" font-size="28" font-weight="700">地球出发</text><text x="95" y="583" fill="#aec7df" font-size="20">由运载火箭送入地火转移轨道</text><text x="890" y="170" fill="#eaf7ff" font-size="28" font-weight="700">火星捕获</text><text x="890" y="213" fill="#aec7df" font-size="20">抵达火星附近后实施制动</text><text x="490" y="175" fill="#eaf7ff" font-size="28" font-weight="700">中途修正</text><text x="490" y="218" fill="#aec7df" font-size="20">修正飞行轨迹</text><text x="800" y="606" fill="#eaf7ff" font-size="28" font-weight="700">地火转移段</text><text x="800" y="649" fill="#aec7df" font-size="20">跨越行星际空间</text></g>
  <text x="70" y="710" fill="#6f96bf" font-family="Microsoft YaHei, sans-serif" font-size="17">依据公开任务流程重绘；不替代官方任务轨迹图。</text>
</svg>
