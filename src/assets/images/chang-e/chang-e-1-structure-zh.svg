<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">嫦娥一号探测器构型中文示意图</title>
  <desc id="desc">以中文标注太阳翼、高增益天线、探测器本体与有效载荷舱的简化技术示意图。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09182f"/><stop offset="1" stop-color="#162b50"/></linearGradient><linearGradient id="body" x2="1" y2="1"><stop stop-color="#dce9f4"/><stop offset="1" stop-color="#778fa9"/></linearGradient></defs>
  <rect width="1200" height="760" fill="url(#bg)"/><g opacity=".26" fill="#d9ecff"><circle cx="104" cy="92" r="2"/><circle cx="220" cy="152" r="1.5"/><circle cx="940" cy="92" r="2"/><circle cx="1080" cy="188" r="1.5"/><circle cx="1030" cy="630" r="2"/><circle cx="140" cy="650" r="1.5"/></g>
  <text x="70" y="90" fill="#b9d9ff" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">嫦娥一号探测器构型</text><text x="70" y="128" fill="#7ea6d2" font-family="Microsoft YaHei, sans-serif" font-size="20">中文重绘示意 · 仅用于展陈技术解读</text>
  <g transform="translate(600 400)"><rect x="-110" y="-82" width="220" height="164" rx="14" fill="url(#body)" stroke="#f3fbff" stroke-width="5"/><rect x="-85" y="-55" width="170" height="110" rx="8" fill="#314e70"/><path d="M-110-28H-410V28H-110M110-28H410V28H110" fill="#2b719e" stroke="#8bd5ff" stroke-width="4"/><path d="M-370-28V28M-330-28V28M-290-28V28M-250-28V28M250-28V28M290-28V28M330-28V28M370-28V28" stroke="#8bd5ff" stroke-width="3"/><path d="M-38-82V-172H38V-82" fill="#d6e9f5" stroke="#f3fbff" stroke-width="4"/><path d="M0-172V-250" stroke="#d6e9f5" stroke-width="12"/><circle cy="-272" r="24" fill="#f4cd68"/><path d="M105 42L190 125" stroke="#d6e9f5" stroke-width="10"/><circle cx="207" cy="142" r="18" fill="#f4cd68"/></g>
  <g fill="none" stroke="#7ee7d0" stroke-width="3"><path d="M220 262H420L490 332"/><path d="M975 270H800L710 348"/><path d="M960 545H790L690 442"/><path d="M220 555H430L505 470"/></g><g fill="#7ee7d0"><circle cx="490" cy="332" r="6"/><circle cx="710" cy="348" r="6"/><circle cx="690" cy="442" r="6"/><circle cx="505" cy="470" r="6"/></g>
  <g fill="#e7f5ff" font-family="Microsoft YaHei, sans-serif"><text x="220" y="242" font-size="28" font-weight="700">太阳翼</text><text x="220" y="285" font-size="20" fill="#a9c6e5">为探测器供电</text><text x="785" y="250" font-size="28" font-weight="700">高增益天线</text><text x="785" y="293" font-size="20" fill="#a9c6e5">承担对地通信</text><text x="790" y="575" font-size="28" font-weight="700">有效载荷舱</text><text x="790" y="618" font-size="20" fill="#a9c6e5">开展月球科学探测</text><text x="220" y="585" font-size="28" font-weight="700">探测器本体</text><text x="220" y="628" font-size="20" fill="#a9c6e5">提供结构与在轨保障</text></g>
  <text x="70" y="710" fill="#6f96bf" font-family="Microsoft YaHei, sans-serif" font-size="17">依据公开资料进行概念化中文重绘；不替代官方工程图。</text>
</svg>
